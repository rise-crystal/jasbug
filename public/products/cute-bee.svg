<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Cute cartoon bee -->
  <ellipse cx="50" cy="55" rx="25" ry="30" fill="#FFD700" stroke="#333" stroke-width="2"/>
  <!-- Stripes -->
  <rect x="25" y="45" width="50" height="8" fill="#333" rx="2"/>
  <rect x="25" y="60" width="50" height="8" fill="#333" rx="2"/>
  <!-- Wings -->
  <ellipse cx="30" cy="35" rx="18" ry="12" fill="#E0F0FF" stroke="#333" stroke-width="1.5" opacity="0.8" transform="rotate(-20 30 35)"/>
  <ellipse cx="70" cy="35" rx="18" ry="12" fill="#E0F0FF" stroke="#333" stroke-width="1.5" opacity="0.8" transform="rotate(20 70 35)"/>
  <!-- Head -->
  <circle cx="50" cy="28" r="14" fill="#FFD700" stroke="#333" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="44" cy="25" r="4" fill="white" stroke="#333" stroke-width="1"/>
  <circle cx="56" cy="25" r="4" fill="white" stroke="#333" stroke-width="1"/>
  <circle cx="45" cy="25" r="2" fill="#333"/>
  <circle cx="57" cy="25" r="2" fill="#333"/>
  <!-- Smile -->
  <path d="M 44 32 Q 50 37 56 32" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Antennae -->
  <path d="M 44 15 Q 38 5 32 8" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 56 15 Q 62 5 68 8" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="32" cy="8" r="3" fill="#333"/>
  <circle cx="68" cy="8" r="3" fill="#333"/>
  <!-- Stinger -->
  <path d="M 50 85 L 46 92 L 54 92 Z" fill="#333"/>
</svg>
